name: CI — Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r app/backend/requirements.txt

      - name: Run user-profile unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
        run: |
          python -m pytest app/tests/test_user_profile.py --noconftest -v

      - name: Run M365/Purview unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
        run: |
          python -m pytest app/tests/test_m365_purview.py --noconftest -v

      - name: Run policy catalog + exporter unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest \
            app/tests/test_policy_catalog_service.py \
            app/tests/test_policy_exporter_refids.py \
            app/tests/test_generate_policy_catalog.py \
            app/tests/test_policy_cache_catalog.py \
            --noconftest -v

      - name: Run mapping recall + gold fixture tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest app/tests/test_mapping_recall.py --noconftest -v

      # Both suites replay frozen model output, so they measure retrieval and
      # classification quality against the NCSP v2.0 gold mapping without needing
      # Azure OpenAI credentials.
      - name: Run coverage classification + taxonomy tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest \
            app/tests/test_control_classification.py \
            app/tests/test_coverage_mapping.py \
            app/tests/test_retrieval_llm_stages.py \
            --noconftest -v

      - name: Run frontend state-init unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/frontend
        run: |
          python -m pytest \
            app/tests/test_state_init_helpers.py \
            app/tests/test_policy_display.py \
            app/tests/test_column_mapping.py \
            app/tests/test_pdf_upload_state.py \
            --noconftest -v

