name: CI — Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r app/backend/requirements.txt

      - name: Run user-profile unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
        run: |
          python -m pytest app/tests/test_user_profile.py --noconftest -v

      # Persistence honesty: a mapping run that stored nothing must not be
      # audited as a completed run, and the only container with a composite
      # partition key must actually be created.
      - name: Run activity persistence + Cosmos partition key tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
        run: |
          python -m pytest \
            app/tests/test_mapping_persistence_is_declared.py \
            app/tests/test_cosmos_composite_partition_key.py \
            --noconftest -v

      # The azd lifecycle hooks declare `shell: sh`, so they must be POSIX. A
      # `&>` bashism in preprovision made the Azure CLI check report failure
      # unconditionally, which blocked azd provision and therefore every
      # automated deployment. Runs against the runner's real /bin/sh.
      - name: Run azd hook POSIX-compliance tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
        run: |
          python -m pytest app/tests/test_azd_hooks_are_posix.py --noconftest -v

      # A subscription Azure Policy requires every subnet to carry an NSG.
      # The template attached one to a single subnet, so provisioning was
      # rejected before any application resource was created -- while the live
      # environment already had all three, created out-of-band. Reads the
      # compiled ARM, so it checks what Azure actually receives.
      - name: Run subnet NSG infrastructure tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
        run: |
          python -m pytest app/tests/test_subnets_have_nsgs.py --noconftest -v

      # Provisioning on every merge to main created duplicate live resources
      # (run 31303805011). These assert the guards that prevent it are present
      # in the workflow file GitHub actually executes.
      - name: Run deploy-workflow safety tests
        run: |
          python -m pytest app/tests/test_deploy_workflow_is_safe.py --noconftest -v

      - name: Run M365/Purview unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
        run: |
          python -m pytest app/tests/test_m365_purview.py --noconftest -v

      - name: Run policy catalog + exporter unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest \
            app/tests/test_policy_catalog_service.py \
            app/tests/test_catalog_freshness_is_declared.py \
            app/tests/test_policy_exporter_refids.py \
            app/tests/test_generate_policy_catalog.py \
            app/tests/test_policy_cache_catalog.py \
            --noconftest -v

      - name: Run mapping recall + gold fixture tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest app/tests/test_mapping_recall.py --noconftest -v

      # Both suites replay frozen model output, so they measure retrieval and
      # classification quality against the NCSP v2.0 gold mapping without needing
      # Azure OpenAI credentials.
      - name: Run coverage classification + taxonomy tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest \
            app/tests/test_control_classification.py \
            app/tests/test_coverage_mapping.py \
            app/tests/test_retrieval_llm_stages.py \
            app/tests/test_attestation_catalog.py \
            --noconftest -v

      # The pipeline path used to carry its own hardcoded menu of policy GUIDs.
      # These lock it to the shared mapping engine, keep invalid identifiers
      # visible rather than silently dropped, and keep a long mapping stage
      # abortable.
      - name: Run pipeline mapping + reporting tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest \
            app/tests/test_pipeline_policy_mapper.py \
            app/tests/test_initiative_builder_drops.py \
            app/tests/test_pipeline_cancellation.py \
            app/tests/test_pipeline_manual_register.py \
            app/tests/test_policy_initiatives.py \
            app/tests/test_sovereignty_procedural.py \
            app/tests/test_gold_fixture_integrity.py \
            app/tests/test_acceptance_invariants.py \
            app/tests/test_catalog_status_route.py \
            app/tests/test_catalog_identifier_kinds.py \
            app/tests/test_empty_extraction_is_declared.py \
            --noconftest -v

      - name: Run frontend state-init unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/frontend
        run: |
          python -m pytest \
            app/tests/test_state_init_helpers.py \
            app/tests/test_policy_display.py \
            app/tests/test_column_mapping.py \
            app/tests/test_pdf_upload_state.py \
            --noconftest -v

