# Throwaway probe. Deleted once it has answered one question:
#
#   Can the built-in GITHUB_TOKEN mint a self-hosted runner registration token?
#
# If it can, the refresh workflow can start its own in-VNet runner with no new
# long-lived credential. If it cannot, a fine-grained PAT or GitHub App is
# required, and that is a decision for a human rather than something to assume
# either way.

name: tmp token capability probe

on:
  push:
    paths:
      - '.github/workflows/tmp-token-test.yml'

permissions:
  contents: read
  administration: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try to mint a runner registration token with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUT=$(gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" 2>&1)
          RC=$?
          set -e
          if [ $RC -eq 0 ]; then
            echo "RESULT=GITHUB_TOKEN_CAN_MINT"
            echo "token length: $(printf '%s' "$OUT" | jq -r .token | wc -c)"
          else
            echo "RESULT=GITHUB_TOKEN_CANNOT_MINT"
            printf '%s\n' "$OUT" | head -n 5
          fi
