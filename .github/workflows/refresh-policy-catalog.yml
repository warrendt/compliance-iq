name: Refresh Azure Policy catalog

# Keeps the shipped built-in policy catalog snapshot
# (app/backend/app/data/policy_catalog/azure_policy_catalog.json) current.
# Runs weekly, or on demand. Opens a PR when the catalog changed so a human
# reviews the diff before it ships.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      subscription:
        description: "Subscription to query (defaults to the AZURE_SUBSCRIPTION_ID var)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  refresh:
    name: Regenerate catalog snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Regenerate policy catalog
        run: |
          python scripts/generate_policy_catalog.py \
            ${{ inputs.subscription && format('--subscription {0}', inputs.subscription) || (vars.AZURE_SUBSCRIPTION_ID && format('--subscription {0}', vars.AZURE_SUBSCRIPTION_ID)) || '' }}

      # The embeddings file is keyed to the catalog it was built from.
      # PolicyCatalogService validates that alignment and *disables semantic
      # search* on a mismatch rather than comparing wrong vectors — safe, but
      # silent: a catalog-only refresh would drop hybrid retrieval back to
      # lexical (measured micro-recall@200 84.4% -> 72.2%) with nothing failing.
      # So the two artifacts are regenerated together and committed together.
      - name: Install embedding dependencies
        run: pip install openai azure-identity numpy

      # Azure OpenAI sits behind a private endpoint with publicNetworkAccess
      # Disabled, which is the correct posture for this product and must not be
      # relaxed to make CI convenient. A GitHub-hosted runner is on the public
      # internet, so it cannot reach the endpoint at all. Without this check the
      # job dies on a bare `403 Public access is disabled` traceback from inside
      # the OpenAI SDK, which reads like a credentials problem and sends the
      # next person to re-check RBAC that was never wrong.
      - name: Check the embedding endpoint is reachable from this runner
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
        run: |
          if [ -z "$AZURE_OPENAI_ENDPOINT" ]; then
            echo "::error::AZURE_OPENAI_ENDPOINT is not set as a repository variable."
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "${AZURE_OPENAI_ENDPOINT%/}/openai/models?api-version=2024-10-21" || echo "000")
          # 401/403-with-auth-challenge means we reached it; a network-level
          # block returns 000, and the private-endpoint denial returns 403 with
          # a body that names it.
          BODY=$(curl -s --max-time 20 \
            "${AZURE_OPENAI_ENDPOINT%/}/openai/models?api-version=2024-10-21" || true)
          echo "probe status=$CODE"
          case "$BODY" in
            *"Public access is disabled"*|*"public network access is disabled"*)
              echo "::error::$AZURE_OPENAI_ENDPOINT refuses public traffic (private endpoint only)."
              echo "::error::A GitHub-hosted runner cannot regenerate embeddings. The catalog"
              echo "::error::and its embeddings must ship together -- a catalog-only refresh"
              echo "::error::silently drops hybrid retrieval to lexical (recall@200 84.4% -> 72.2%),"
              echo "::error::so this job fails instead of opening a partial PR."
              echo "::error::Run the refresh from inside the VNet (self-hosted runner or an"
              echo "::error::Azure Container Apps job), or grant this runner network access."
              exit 1 ;;
          esac
          if [ "$CODE" = "000" ]; then
            echo "::error::Could not reach $AZURE_OPENAI_ENDPOINT from this runner (network block or DNS)."
            exit 1
          fi
          echo "endpoint reachable (HTTP $CODE) - proceeding"

      - name: Regenerate catalog embeddings
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: |
          python scripts/generate_policy_catalog_embeddings.py \
            ${AZURE_OPENAI_ENDPOINT:+--endpoint "$AZURE_OPENAI_ENDPOINT"} \
            ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:+--deployment "$AZURE_OPENAI_EMBEDDING_DEPLOYMENT"}

      - name: Verify the two artifacts agree
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest \
            app/tests/test_policy_catalog_service.py \
            app/tests/test_generate_policy_catalog.py \
            app/tests/test_mapping_recall.py \
            --noconftest -q

      - name: Open PR if the catalog changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh Azure Policy catalog snapshot"
          title: "chore: refresh Azure Policy catalog snapshot"
          body: |
            Automated refresh of the built-in Azure Policy catalog used for
            control→policy retrieval, with its embedding index regenerated from
            the same snapshot.

            Review the diff (added/removed/renamed built-in policy definitions)
            before merging. The recall tests in `app/tests/test_mapping_recall.py`
            ran against the refreshed pair and passed; a drop there means the
            refresh changed retrieval quality, not just catalog contents.
          branch: chore/refresh-policy-catalog
          add-paths: |
            app/backend/app/data/policy_catalog/azure_policy_catalog.json
            app/backend/app/data/policy_catalog/azure_policy_catalog_embeddings.npz
          delete-branch: true
