name: Refresh Azure Policy catalog

# Keeps the shipped built-in policy catalog snapshot
# (app/backend/app/data/policy_catalog/azure_policy_catalog.json) current.
# Runs weekly, or on demand. Opens a PR when the catalog changed so a human
# reviews the diff before it ships.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      subscription:
        description: "Subscription to query (defaults to the AZURE_SUBSCRIPTION_ID var)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  refresh:
    name: Regenerate catalog snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Regenerate policy catalog
        run: |
          python scripts/generate_policy_catalog.py \
            ${{ inputs.subscription && format('--subscription {0}', inputs.subscription) || (vars.AZURE_SUBSCRIPTION_ID && format('--subscription {0}', vars.AZURE_SUBSCRIPTION_ID)) || '' }}

      # The embeddings file is keyed to the catalog it was built from.
      # PolicyCatalogService validates that alignment and *disables semantic
      # search* on a mismatch rather than comparing wrong vectors — safe, but
      # silent: a catalog-only refresh would drop hybrid retrieval back to
      # lexical (measured micro-recall@200 84.4% -> 72.2%) with nothing failing.
      # So the two artifacts are regenerated together and committed together.
      # The embeddings half runs on a different machine (see the `embeddings`
      # job), so the catalog is handed over as an artifact.
      - name: Hand the catalog to the in-VNet runner
        uses: actions/upload-artifact@v4
        with:
          name: policy-catalog
          path: app/backend/app/data/policy_catalog/azure_policy_catalog.json
          retention-days: 1
          if-no-files-found: error

      # Azure OpenAI sits behind a private endpoint with publicNetworkAccess
      # Disabled, which is the correct posture for this product and must not be
      # relaxed to make CI convenient. A GitHub-hosted runner is on the public
      # internet and cannot reach it -- verified in run 31306629840, which got
      # "403 Public access is disabled".
      #
      # So the embedding step runs on an ephemeral self-hosted runner inside
      # vnet-complianceiq-dev-kz2jze, started here, on demand, for one job.
      # It is started *last* so it is listening by the time the next job queues,
      # and it deregisters itself when that job finishes.
      #
      # This needs a token that can register a runner. The built-in GITHUB_TOKEN
      # cannot: `administration` is not a permission it can be granted, which
      # was tested rather than assumed. So a fine-grained PAT is required,
      # scoped to this repository with Administration: read and write.
      - name: Start the in-VNet runner
        env:
          RUNNER_PAT: ${{ secrets.RUNNER_REGISTRATION_PAT }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          JOB_NAME: ${{ vars.AZURE_VNET_RUNNER_JOB }}
        run: |
          if [ -z "$RUNNER_PAT" ]; then
            echo "::error::Secret RUNNER_REGISTRATION_PAT is not set, so the"
            echo "::error::in-VNet runner cannot be started and the embeddings"
            echo "::error::cannot be regenerated."
            echo "::error::"
            echo "::error::Create a fine-grained personal access token limited to"
            echo "::error::this repository with 'Administration: read and write',"
            echo "::error::and store it as the RUNNER_REGISTRATION_PAT secret."
            echo "::error::"
            echo "::error::Failing here rather than opening a PR with a catalog"
            echo "::error::whose embeddings were never rebuilt."
            exit 1
          fi

          TOKEN=$(curl -sS -X POST \
            -H "Authorization: Bearer $RUNNER_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token" \
            | jq -r .token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not mint a runner registration token."
            echo "::error::Check that RUNNER_REGISTRATION_PAT has Administration:"
            echo "::error::read and write on ${GITHUB_REPOSITORY} and has not expired."
            exit 1
          fi

          az containerapp job secret set \
            -n "$JOB_NAME" -g "$RG" \
            --secrets "runner-token=$TOKEN" -o none

          az containerapp job start -n "$JOB_NAME" -g "$RG" -o none
          echo "started $JOB_NAME; it will pick up the embeddings job"

  embeddings:
    name: Regenerate embeddings (inside the VNet)
    needs: refresh
    # This job must run inside vnet-complianceiq-dev-kz2jze. On a GitHub-hosted
    # runner every step below fails with 403, which is the whole reason this
    # runner exists. Do not move it back to ubuntu-latest.
    runs-on: [self-hosted, ciq-vnet]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Take the catalog from the previous job
        uses: actions/download-artifact@v4
        with:
          name: policy-catalog
          path: app/backend/app/data/policy_catalog/

      - name: Authenticate with the runner's managed identity
        run: az login --identity -o none

      - name: Install embedding dependencies
        run: python3 -m pip install --quiet openai azure-identity numpy

      # Kept from when this ran on a hosted runner, where it correctly refused
      # to continue. Here it should pass. If it ever fails again, the runner has
      # lost its place on the VNet and the failure names that directly, rather
      # than surfacing as a 403 traceback from inside the OpenAI SDK that reads
      # like a credentials problem.
      - name: Check the embedding endpoint is reachable from this runner
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: |
          HOST=$(printf '%s' "${AZURE_OPENAI_ENDPOINT#https://}" | tr -d '/')
          IP=$(getent hosts "$HOST" | awk '{print $1}' | head -n1)
          echo "$HOST resolves to ${IP:-nothing}"
          case "$IP" in
            10.*) : ;;
            *) echo "::error::$HOST resolved to '${IP:-nothing}', not a private"
               echo "::error::address. This runner is not on the VNet, so the"
               echo "::error::embeddings endpoint will refuse it."
               exit 1 ;;
          esac

          TOKEN=$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken -o tsv)
          URL="${AZURE_OPENAI_ENDPOINT%/}/openai/deployments/${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}/embeddings?api-version=2024-10-21"
          CODE=$(curl -s -o /tmp/probe -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"input":"connectivity probe"}')
          echo "authenticated probe status=$CODE"
          if [ "$CODE" != "200" ]; then
            head -c 400 /tmp/probe; echo ""
            echo "::error::Expected HTTP 200 from the embeddings endpoint, got $CODE."
            exit 1
          fi

      - name: Regenerate catalog embeddings
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
        run: |
          python3 scripts/generate_policy_catalog_embeddings.py \
            ${AZURE_OPENAI_ENDPOINT:+--endpoint "$AZURE_OPENAI_ENDPOINT"} \
            ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:+--deployment "$AZURE_OPENAI_EMBEDDING_DEPLOYMENT"}

      - name: Hand both artifacts back
        uses: actions/upload-artifact@v4
        with:
          name: policy-catalog-with-embeddings
          path: |
            app/backend/app/data/policy_catalog/azure_policy_catalog.json
            app/backend/app/data/policy_catalog/azure_policy_catalog_embeddings.npz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Verify and open PR
    needs: embeddings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect the refreshed pair
        uses: actions/download-artifact@v4
        with:
          name: policy-catalog-with-embeddings
          path: app/backend/app/data/policy_catalog/

      # This step used to run without installing anything, so `python -m pytest`
      # would have died on a missing module. It never showed, because the job
      # had failed at the endpoint probe long before reaching it -- a step that
      # has never once executed carries no evidence that it works.
      - name: Install backend dependencies
        run: pip install -r app/backend/requirements.txt

      - name: Verify the two artifacts agree
        env:
          PYTHONPATH: ${{ github.workspace }}/app/backend
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT_NAME: gpt
          ENABLE_AUTH: "false"
        run: |
          python -m pytest \
            app/tests/test_policy_catalog_service.py \
            app/tests/test_generate_policy_catalog.py \
            app/tests/test_mapping_recall.py \
            --noconftest -q

      - name: Open PR if the catalog changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh Azure Policy catalog snapshot"
          title: "chore: refresh Azure Policy catalog snapshot"
          body: |
            Automated refresh of the built-in Azure Policy catalog used for
            control→policy retrieval, with its embedding index regenerated from
            the same snapshot.

            Review the diff (added/removed/renamed built-in policy definitions)
            before merging. The recall tests in `app/tests/test_mapping_recall.py`
            ran against the refreshed pair and passed; a drop there means the
            refresh changed retrieval quality, not just catalog contents.
          branch: chore/refresh-policy-catalog
          add-paths: |
            app/backend/app/data/policy_catalog/azure_policy_catalog.json
            app/backend/app/data/policy_catalog/azure_policy_catalog_embeddings.npz
          delete-branch: true
