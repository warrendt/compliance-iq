# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# =============================================================================
# ComplianceIQ — Root azure.yaml
#
# THIS is the file azd actually reads. The workflows run `azd provision` /
# `azd deploy` from the repository root, so this file -- not app/azure.yaml --
# defines the deployment.
#
# app/azure.yaml is a near-duplicate kept for running azd from inside app/.
# azd has no include or delegation mechanism, so the two files do NOT share
# anything: any change to hooks, services or infra must be made in both, and a
# fix applied to only one is silently inert. That is not hypothetical -- the
# `&>` bashism below was first fixed in app/azure.yaml alone and the deployment
# failed again with byte-identical output.
# =============================================================================

name: compliance-iq
metadata:
  template: compliance-iq@1.0.0

infra:
  provider: bicep
  path: app/infra
  module: main

services:
  backend:
    project: app/backend
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

  frontend:
    project: app/frontend
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true

hooks:
  preprovision:
    posix:
      shell: sh
      run: |
        echo "Pre-provisioning checks..."
        # NOTE: this hook declares `shell: sh`, so it must be POSIX. `&>` is a
        # bashism: under dash (which is /bin/sh on the CI runners) it parses as
        # "run in the background" followed by a bare `> /dev/null` redirect, and
        # the redirect's exit status -- always 0 -- becomes the `if` condition.
        # Both checks therefore reported failure unconditionally, even with az
        # present and logged in. Keep these redirects POSIX.
        if ! command -v az >/dev/null 2>&1; then
          echo "Error: Azure CLI is not installed"
          exit 1
        fi
        echo "✓ Azure CLI found"
        if ! az account show >/dev/null 2>&1; then
          echo "Error: Not logged in to Azure. Run 'az login'"
          exit 1
        fi
        echo "✓ Azure authentication verified"

        echo ""
        echo "======================================"
        echo " Authentication Configuration"
        echo "======================================"
        if [ -n "${AUTH_CLIENT_ID}" ]; then
          echo "✓ Entra ID authentication ENABLED"
          echo "  Client ID: ${AUTH_CLIENT_ID}"
          echo "  Tenant ID: ${AUTH_TENANT_ID:-<deployment tenant>}"
        else
          echo "⚠ Entra ID authentication DISABLED"
          echo "  To enable, set these environment variables before deploying:"
          echo "    azd env set AUTH_CLIENT_ID <your-app-registration-client-id>"
          echo "    azd env set AUTH_TENANT_ID <your-tenant-id>"
        fi
      continueOnError: false

  postprovision:
    posix:
      shell: sh
      run: |
        echo ""
        echo "======================================"
        echo " Deployment Summary"
        echo "======================================"
        echo "Environment: ${AZURE_ENV_NAME}"
        echo "Resource Group: ${AZURE_RESOURCE_GROUP}"
        echo "Location: ${AZURE_LOCATION}"
        echo ""
        echo "Frontend URL: ${FRONTEND_URI}"
        echo "Backend URL: ${BACKEND_URI}"
        echo ""
        if [ -n "${AUTH_CLIENT_ID}" ]; then
          echo "Authentication: ✓ Entra ID enabled"
        else
          echo "Authentication: ⚠ Disabled (anonymous access)"
        fi
        echo ""
        echo "✓ Deployment complete!"
      continueOnError: true
