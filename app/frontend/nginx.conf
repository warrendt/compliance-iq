worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Match the PDF pipeline's documented and backend-enforced 50 MB limit.
    client_max_body_size 50m;
    sendfile      on;
    keepalive_timeout 65;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    proxy_temp_path /tmp/nginx-proxy-temp;
    client_body_temp_path /tmp/nginx-client-temp;
    fastcgi_temp_path /tmp/nginx-fastcgi-temp;
    uwsgi_temp_path /tmp/nginx-uwsgi-temp;
    scgi_temp_path /tmp/nginx-scgi-temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream streamlit_upstream {
        server 127.0.0.1:8502;
    }

    server {
        listen 8501;
        server_name _;

        # __API_PROXY_START__
        # Reverse-proxy /api/* to the internal backend Container App. The backend
        # has internal-only ingress, so the frontend is the single public door;
        # this lets API clients (e.g. the ComplianceIQ Copilot skill) reach the
        # backend at https://<frontend-fqdn>/api/v1/... using an Entra bearer
        # token. Rendered at startup by start.sh from the BACKEND_URL env var;
        # the whole block is stripped when BACKEND_URL is unset.
        location ^~ /api/ {
            resolver __DNS_RESOLVER__ valid=30s ipv6=off;
            set $api_backend "__BACKEND_URL__";
            proxy_pass $api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host __BACKEND_HOST__;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pipeline/mapping jobs can run for minutes; keep the upstream open.
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # Stream large PDF uploads straight through (50m limit set above).
            proxy_request_buffering off;
        }
        # __API_PROXY_END__

        # Streamlit first probes its current deep-link path for discovery metadata.
        # Reject those probes so it falls back to root endpoints instead of treating
        # the page path as its base URL and duplicating the route.
        location ~ ^/.+/_stcore/(health|host-config)$ {
            return 404;
        }

        # Streamlit opens its WebSocket relative to a deep-linked page. Rewrite
        # the stream and other support endpoints back to Streamlit's root.
        location ~ ^/.+/_stcore/(.*)$ {
            proxy_pass http://streamlit_upstream/_stcore/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Streamlit's frontend loads lazy chunks relative to the deep-linked
        # page. Map those page-prefixed asset requests back to their root paths.
        location ~ ^/.+/(static/.*)$ {
            proxy_pass http://streamlit_upstream/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header X-Forwarded-Uri $request_uri;
        }

        location ~ ^/(Platform_Selection|Upload_Controls|AI_Mapping|Review_Edit|Export_Policy|PDF_Pipeline|Policy_Explorer|Profile|Diff_Compare|Version_History)/?$ {
            rewrite ^ / break;
            proxy_pass http://streamlit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location / {
            proxy_pass http://streamlit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
