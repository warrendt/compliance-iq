[client]
showSidebarNavigation = false

# ComplianceIQ brand design tokens (navy shell + intelligence blue).
# Keep these in sync with the CSS variables in utils/theme.py.
[theme]
base = "light"
primaryColor = "#2563EB"            # intelligence blue (primary action / AI)
backgroundColor = "#F8FAFC"         # app canvas
secondaryBackgroundColor = "#F1F5FA" # nav / layers
textColor = "#0B2545"               # brand navy (strong text)
font = "sans serif"                 # Segoe UI Variable, Segoe UI, system sans

[server]
port = 8502
address = "127.0.0.1"
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
