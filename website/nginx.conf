# ComplianceIQ marketing site — nginx (static)
# Runs as the stock nginx:alpine unprivileged-friendly config on port 8080.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Writable temp paths so the container can run read-only / non-root.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (static marketing site; no inline eval needed).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Long-cache immutable-ish assets; keep HTML + config short-lived.
        location ~* \.(?:css|js|png|jpg|jpeg|svg|ico|webp|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
        location = /config.js {
            add_header Cache-Control "no-cache";
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
